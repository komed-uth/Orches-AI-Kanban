<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gem Trail — pilot game</title>
  <style>
    body { background:#112031; color:#edf6ff; font:18px system-ui; max-width:620px; margin:3rem auto; padding:0 1rem; }
    #board { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; max-width:360px; margin:1rem 0; }
    .cell { display:grid; place-items:center; aspect-ratio:1; background:#21384f; color:#7ce8d4; font-size:30px; border-radius:6px; }
    button { padding:.6rem 1rem; font:inherit; cursor:pointer; margin:.2rem; }
    a { color:#9edbff; }
  </style>
</head>
<body>
  <h1>Gem Trail</h1>
  <p>Collect all five diamonds. Use arrow keys, WASD, or the direction buttons.</p>
  <p id="status" role="status"></p>
  <div id="board" role="group" aria-label="Game board"></div>
  <div aria-label="Direction controls">
    <button data-move="0,-1" aria-label="Move up">↑</button>
    <button data-move="-1,0" aria-label="Move left">←</button>
    <button data-move="0,1" aria-label="Move down">↓</button>
    <button data-move="1,0" aria-label="Move right">→</button>
  </div>
  <button id="restart">Restart game</button>
  <p><a href="/">Return to board</a></p>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
