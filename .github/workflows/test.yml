name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - id: tests
        run: npm test 2>&1 | tee "$RUNNER_TEMP/contributor-tests.log"
      - name: Expose contributor failure diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const log = readFileSync(`${process.env.RUNNER_TEMP}/contributor-tests.log`, 'utf8');
          const message = log.slice(-16000).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          console.log(`::error title=Contributor test failure::${message}`);
          NODE
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
